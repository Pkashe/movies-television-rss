
name: Publish Movies and Television RSS

on:
  workflow_dispatch:
  schedule:
    # Apify runs at 00:00, 08:00, 16:00 UTC.
    # Publish one hour later.
    - cron: '0 1,9,17 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate RSS from most recent successful Apify task
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          APIFY_TASK: notched_trainee~movies-television-top-today
          FEED_BASE_URL: https://pkashe.github.io/movies-television-rss
        run: python generate_rss.py

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy RSS to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
