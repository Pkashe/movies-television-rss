
name: Publish Movies and Television RSS

on:
  workflow_dispatch:
  schedule:
    - cron: '30 17 * * *'
      timezone: "Australia/Sydney"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate combined Movies and Television RSS
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          APIFY_TASK: 5IGGtHCecD58Bptm3
          FEED_BASE_URL: https://pkashe.github.io/movies-television-rss
        run: python generate_rss.py

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload RSS files
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Publish RSS to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
